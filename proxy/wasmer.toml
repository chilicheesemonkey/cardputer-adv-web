[package]
name = "YOUR_WASMER_USERNAME/cardputer-proxy"
version = "0.1.0"
description = "Text-mode rendering proxy for the Cardputer browser"

[dependencies]
"wasmer/winterjs" = "*"

[fs]
"/src" = "./src"

[[command]]
name = "script"
module = "wasmer/winterjs:winterjs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
env = ["JS_PATH=/src/index.js"]
main-args = ["/src/index.js"]
