name: Build firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio esptool
      - run: pio run
      - name: Merge into one flashable image
        run: |
          B=.pio/build/cardputer
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -n1)
          esptool.py --chip esp32s3 merge_bin -o cardputer-browser-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT" 0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cardputer-browser
          path: |
            cardputer-browser-merged.bin
            .pio/build/cardputer/firmware.bin
